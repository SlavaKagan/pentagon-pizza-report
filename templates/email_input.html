<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>שלח דוח סטטוס סניפים</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;  /* מרכז אנכית */
      align-items: center;      /* מרכז אופקית */
      text-align: center;
      background: #fafafa;
    }

    h2 {
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    label {
      align-self: center;
    }

    input[type="email"] {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f0f0f0;
      cursor: pointer;
    }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    .ok { color: #2e7d32; }
    .err { color: #d32f2f; }
    .info { color: #1976d2; }

    /* הלוגו */
    #logo {
      margin-top: 20px;
      max-width: 200px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>
  <h2>📬 הזן כתובת מייל לשליחת דוח סטטוס</h2>

  <form id="emailForm">
    <label for="email">כתובת מייל:</label>
    <input type="email" id="email" name="email" required placeholder="example@gmail.com" />
    <button id="sendBtn" type="submit">שלח דוח</button>
  </form>

  <p id="status"></p>

  <!-- הלוגו במרכז מתחת לטופס -->
  <img id="logo" src="{{ url_for('static', filename='PizzaLogo.jpg') }}" alt="Pizza Logo" />

  <script>
    const form = document.getElementById('emailForm');
    const emailInput = document.getElementById('email');
    const statusEl = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = (emailInput.value || '').trim();

      if (!email) {
        statusEl.textContent = '❌ יש להזין כתובת מייל';
        statusEl.className = 'err';
        emailInput.focus();
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = '⏳ שולח את הדוח...';
      statusEl.className = 'info';

      try {
        const res = await fetch('/send_report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          statusEl.textContent = `✅ ${data.message || 'הדוח נשלח בהצלחה'} (${email})`;
          statusEl.className = 'ok';
        } else {
          statusEl.textContent = `❌ ${data.message || 'אירעה שגיאה בשליחה'}`;
          statusEl.className = 'err';
        }
      } catch (err) {
        statusEl.textContent = `❌ שגיאה בשליחת הבקשה: ${err?.message || ''}`;
        statusEl.className = 'err';
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
